[project]
name = "erika-tools"
version = "0.1.0"
description = "Native port and extraction tools for Erika (JAST, PC-8801)"
readme = "README.md"
authors = [
    { name = "Konosprod", email = "konosprod@free.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "polib>=1.2.0",
    "pygame-ce>=2.5.8",
    "z80dis>=1.0.6",
]

[project.scripts]
erika = "erika_tools.cli:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
